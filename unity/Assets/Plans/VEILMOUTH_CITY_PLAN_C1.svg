<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="Segoe UI, Arial, sans-serif">
  <!-- Veilmouth C1, proposed 2026-11-05. 1 px = 1 m. World X = px - 500, world Z = 500 - py. North is up. -->
  <rect x="0" y="0" width="1000" height="1000" fill="#d9e8bf"/>
  <!-- forest -->
  <path d="M0 0 H780 V440 H760 V470 H0 Z" fill="#8cbc76"/>
  <text x="40" y="200" font-size="22" fill="#3d6b2e">Forest: glades, herbs, felling; wolves deep in</text>
  <!-- fields -->
  <rect x="0" y="480" width="260" height="350" fill="#e8dfa6"/>
  <text x="40" y="560" font-size="16" fill="#7a6a20">Fields and farms</text>
  <text x="40" y="580" font-size="12" fill="#7a6a20">flax plot, boars at the forest edge</text>
  <!-- hill across the river -->
  <ellipse cx="920" cy="360" rx="75" ry="170" fill="#c9b98f"/>
  <text x="868" y="330" font-size="14" fill="#5e4e28">Ore hill</text>
  <text x="868" y="346" font-size="11" fill="#5e4e28">12 iron veins</text>
  <!-- sea and river -->
  <rect x="0" y="830" width="1000" height="170" fill="#7fb2d9"/>
  <text x="420" y="930" font-size="22" fill="#2a5a85">The sea (Sea Level 24 m)</text>
  <rect x="780" y="0" width="40" height="830" fill="#7fb2d9"/>
  <text x="808" y="120" font-size="14" fill="#2a5a85" transform="rotate(90 808 120)">River Veil, 40 m</text>
  <rect x="740" y="790" width="120" height="40" fill="#7fb2d9"/>
  <!-- city ground -->
  <rect x="280" y="490" width="500" height="340" fill="#ece6da"/>
  <!-- districts -->
  <rect x="280" y="490" width="500" height="110" fill="#e3d6f0"/>
  <text x="290" y="506" font-size="12" fill="#5b3f7a">THE RIDGE, +8 m: villas and gardens; palace</text>
  <rect x="280" y="600" width="200" height="62" fill="#f6e3c4"/>
  <text x="286" y="612" font-size="10" fill="#7a5320">TERRACES: front areas, railings, steps</text>
  <rect x="540" y="600" width="240" height="62" fill="#e9cfc7"/>
  <text x="600" y="612" font-size="10" fill="#7a3b2a">UNDER THE RIDGE: rookery</text>
  <rect x="280" y="680" width="280" height="150" fill="#f3efc4"/>
  <text x="286" y="694" font-size="11" fill="#6b6420">MARKET QUARTER: shops, workshops</text>
  <rect x="560" y="680" width="220" height="150" fill="#e9cfc7"/>
  <text x="566" y="694" font-size="11" fill="#7a3b2a">LOWER VEIL: tenements, courts, docks</text>
  <!-- old wall and gates -->
  <polyline points="280,830 280,490 760,490" fill="none" stroke="#6d6253" stroke-width="5"/>
  <text x="200" y="470" font-size="11" fill="#6d6253">old town wall, 6 m</text>
  <rect x="272" y="664" width="16" height="22" fill="#4a4036"/>
  <text x="196" y="660" font-size="11" fill="#4a4036">West Gate</text>
  <rect x="612" y="482" width="22" height="16" fill="#4a4036"/>
  <text x="640" y="478" font-size="11" fill="#4a4036">North Gate</text>
  <!-- roads out -->
  <rect x="0" y="668" width="272" height="8" fill="#b7a98c"/>
  <rect x="619" y="0" width="8" height="482" fill="#b7a98c"/>
  <rect x="820" y="668" width="130" height="8" fill="#b7a98c"/>
  <!-- ridge escarpment -->
  <line x1="280" y1="600" x2="780" y2="600" stroke="#8a6fa8" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- streets -->
  <g fill="#9a9a9a">
    <rect x="280" y="662" width="500" height="18"/>
    <rect x="482" y="560" width="36" height="86"/>
    <rect x="280" y="580" width="202" height="12"/>
    <rect x="518" y="580" width="190" height="12"/>
    <rect x="304" y="592" width="12" height="70"/>
    <rect x="414" y="592" width="12" height="70"/>
    <rect x="454" y="680" width="12" height="150"/>
    <rect x="280" y="736" width="280" height="10"/>
    <rect x="560" y="730" width="176" height="10"/>
    <rect x="580" y="778" width="156" height="6"/>
    <rect x="736" y="680" width="12" height="150"/>
    <rect x="540" y="810" width="196" height="20"/>
  </g>
  <g fill="#b9b9b9">
    <rect x="620" y="680" width="3" height="50"/>
    <rect x="670" y="740" width="3" height="38"/>
    <rect x="700" y="592" width="8" height="58" fill="#7d6a58"/>
    <rect x="600" y="620" width="3" height="42"/>
  </g>
  <!-- Crown Circus, avenue trees -->
  <circle cx="500" cy="671" r="25" fill="#b0b0b0"/>
  <g fill="#5c9a4a">
    <circle cx="496" cy="575" r="3"/><circle cx="504" cy="575" r="3"/><circle cx="496" cy="595" r="3"/><circle cx="504" cy="595" r="3"/>
    <circle cx="496" cy="615" r="3"/><circle cx="504" cy="615" r="3"/><circle cx="496" cy="635" r="3"/><circle cx="504" cy="635" r="3"/>
  </g>
  <!-- garden square -->
  <rect x="340" y="610" width="50" height="40" fill="#a9cf8e" stroke="#2e2e2e" stroke-width="1"/>
  <text x="343" y="633" font-size="8" fill="#2e4d22">Wardley Sq.</text>
  <!-- market square -->
  <rect x="370" y="720" width="60" height="45" fill="#cfc28f" stroke="#7a6a20"/>
  <text x="378" y="746" font-size="9" fill="#5a4e15">Market Square</text>
  <!-- key buildings -->
  <g stroke="#222" stroke-width="1">
    <rect x="440" y="495" width="120" height="35" fill="#b48fd6"/>
    <rect x="460" y="530" width="80" height="30" fill="#ddd0ea"/>
    <rect x="420" y="610" width="58" height="30" fill="#c9a26b"/>
    <rect x="522" y="610" width="58" height="30" fill="#6f8fc9"/>
    <rect x="590" y="560" width="22" height="18" fill="#3fa3a3"/>
    <rect x="295" y="505" width="30" height="35" fill="#9a8f80"/>
    <rect x="696" y="714" width="18" height="16" fill="#d28a3a"/>
    <rect x="716" y="716" width="14" height="14" fill="#5aa05a"/>
    <rect x="642" y="748" width="25" height="24" fill="#e07070"/>
    <rect x="625" y="766" width="12" height="12" fill="#c7c7c7"/>
    <rect x="600" y="784" width="12" height="12" fill="#e8a15a"/>
    <rect x="700" y="810" width="36" height="16" fill="#8a8a8a"/>
    <rect x="350" y="700" width="14" height="15" fill="#7fb07f"/>
  </g>
  <g font-size="9" fill="#111">
    <text x="470" y="516">Governor's Palace</text>
    <text x="474" y="549">forecourt</text>
    <text x="382" y="604">Town Hall</text>
    <text x="583" y="606">Wardens + lock-up</text>
    <text x="563" y="556">Faction house</text>
    <text x="287" y="500">Old chapel</text>
    <text x="711" y="623" transform="rotate(90 711 623)">Soot Stair</text>
    <text x="706" y="660">cellar ▲</text>
    <text x="660" y="711">Soot &amp; Bell</text>
    <text x="734" y="728">Harrow</text>
    <text x="604" y="744">Ritual sq. 1</text>
    <text x="596" y="806">pawn</text>
    <text x="566" y="775">tenement</text>
    <text x="690" y="806">Customs</text>
    <text x="320" y="712">Item yard</text>
    <text x="520" y="680">Crown Circus</text>
    <text x="300" y="676" font-size="10">HIGH STREET, 18 m</text>
    <text x="523" y="576" font-size="8">Ridge Street, 12 m</text>
    <text x="488" y="590" font-size="8" transform="rotate(-90 488 620)">Crown Avenue 36 m</text>
    <text x="458" y="800" font-size="8" transform="rotate(-90 462 800)">Cheap Street</text>
    <text x="286" y="744" font-size="8">Mercers Row</text>
    <text x="566" y="738" font-size="8">Bell Street</text>
    <text x="582" y="790" font-size="7">Loom Lane</text>
    <text x="742" y="760" font-size="8" transform="rotate(90 742 760)">Dock Road</text>
    <text x="560" y="824" font-size="9">Sea quay</text>
  </g>
  <!-- arch passages to courtyards -->
  <g fill="#ffd400" stroke="#222">
    <circle cx="316" cy="640" r="5"/><circle cx="366" cy="716" r="5"/><circle cx="623" cy="730" r="5"/><circle cx="706" cy="732" r="5"/>
  </g>
  <!-- bridge -->
  <rect x="780" y="664" width="40" height="16" fill="#8b7355"/>
  <text x="826" y="662" font-size="10" fill="#4a3a22">Veil Bridge</text>
  <!-- legend -->
  <g font-size="10" fill="#111">
    <rect x="12" y="846" width="250" height="140" fill="#ffffff" opacity="0.9" stroke="#555"/>
    <text x="20" y="862" font-weight="bold">Veilmouth C1 (proposed) — 1 px = 1 m</text>
    <circle cx="26" cy="878" r="5" fill="#ffd400" stroke="#222"/><text x="38" y="882">arch passage into a courtyard</text>
    <rect x="20" y="890" width="12" height="8" fill="#9a9a9a"/><text x="38" y="898">paved street (carriageway + pavements)</text>
    <rect x="20" y="906" width="12" height="8" fill="#7d6a58"/><text x="38" y="914">stair lane</text>
    <line x1="20" y1="926" x2="32" y2="926" stroke="#8a6fa8" stroke-width="2" stroke-dasharray="4 2"/><text x="38" y="930">Ridge edge: retaining wall, +8 m</text>
    <rect x="20" y="938" width="12" height="8" fill="#e07070"/><text x="38" y="946">Ritual Site Candidates 1 (2: cellar, 3: chapel)</text>
    <text x="20" y="964">Names are placeholders. Sizes: authoring</text>
    <text x="20" y="978">defaults until the owner accepts C1.</text>
  </g>
  <!-- courtyard example inset -->
  <g transform="translate(830,18)">
    <rect x="0" y="0" width="160" height="200" fill="#ffffff" stroke="#333"/>
    <text x="6" y="14" font-size="10" font-weight="bold">Example: mews court (×2)</text>
    <rect x="10" y="24" width="140" height="18" fill="#f6e3c4" stroke="#999"/>
    <text x="14" y="36" font-size="8">terrace fronts on the street</text>
    <rect x="66" y="42" width="28" height="14" fill="#ffd400" stroke="#222"/>
    <text x="70" y="52" font-size="7">ARCH</text>
    <rect x="10" y="56" width="140" height="90" fill="#cfc7b8" stroke="#999"/>
    <text x="16" y="68" font-size="7">cobbled court 28 × 18 m</text>
    <rect x="14" y="74" width="18" height="12" fill="#8b6a4a"/><text x="34" y="83" font-size="7">stable doors</text>
    <rect x="100" y="74" width="22" height="10" fill="#6d5a40"/><text x="100" y="94" font-size="7">carriage</text>
    <circle cx="80" cy="110" r="5" fill="#5f88b0"/><text x="88" y="113" font-size="7">pump + trough</text>
    <line x1="20" y1="128" x2="70" y2="128" stroke="#777" stroke-dasharray="2 2"/><text x="20" y="139" font-size="7">laundry line, crates, hay</text>
    <rect x="128" y="120" width="10" height="10" fill="#333"/><text x="104" y="141" font-size="7">wall lamp</text>
    <rect x="10" y="146" width="140" height="16" fill="#e3d6f0" stroke="#999"/>
    <text x="14" y="157" font-size="7">mews cottages (back of the block)</text>
    <text x="6" y="178" font-size="8">Others: tenement court (Lower Veil),</text>
    <text x="6" y="190" font-size="8">workshop yard (Item Creation), inn yard.</text>
  </g>
</svg>
