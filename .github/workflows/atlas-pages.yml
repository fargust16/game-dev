name: Publish Game Design Atlas

on:
  push:
    branches: [main]
    paths:
      - "game-design-atlas/**"
      - "References/**"
      - ".github/workflows/atlas-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export the static atlas
        run: python game-design-atlas/export_static.py

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: game-design-atlas/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
